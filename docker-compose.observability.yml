# Optional observability backend on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build --wait
#   Grafana: http://localhost:3000 (Tempo = traces, Prometheus = metrics)
#
# grafana/otel-lgtm bundles an OpenTelemetry Collector, Tempo, Prometheus, Loki and Grafana in one container.
# It is meant for local use only and is not part of the default stack (large image).
services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.1
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  app:
    depends_on:
      otel-lgtm:
        condition: service_healthy
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-lgtm:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-lgtm:4318/v1/metrics
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 10s
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
