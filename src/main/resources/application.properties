spring.application.name=crud

spring.threads.virtual.enabled=true

# API version comes from the path: /api/v1/... (segment index 1, "v" prefix is accepted by the parser)
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.supported=1

spring.datasource.hikari.connection-timeout=2000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis backs the Idempotency-Key store; fail fast so a Redis outage becomes a quick 503, not a hung request
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
app.idempotency.lock-ttl=30s
app.idempotency.retention=24h

# Only health is exposed (used by container healthchecks); it aggregates db and redis indicators
management.endpoints.web.exposure.include=health

# ---- Observability (docs/architecture-flow.md, section 7) ----
# RED metrics come from http.server.requests; histogram buckets let the backend compute p95/p99 latency
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Sample 10% of traces by default; raise per environment (the observability compose overlay uses 1.0)
management.tracing.sampling.probability=0.1
# Metrics and traces are pushed over OTLP only where a collector exists: the trace endpoint is empty by default
# and metric export is off here, both enabled per environment (see docker-compose.observability.yml)
management.otlp.metrics.export.enabled=false
